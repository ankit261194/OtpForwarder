<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Smart Store - Founder PC Vault (AES-256 Encrypted)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070A12;
            --card: #111827;
            --surface: #1E293B;
            --border: #1E2C4A;
            --accent-blue: #3B82F6;
            --accent-indigo: #6366F1;
            --accent-emerald: #10B981;
            --accent-amber: #F59E0B;
            --text-pri: #FFFFFF;
            --text-sec: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-pri); min-height: 100vh; padding: 24px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
        .title { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 800; }
        .badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid var(--accent-blue); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent-blue); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .card-cat { font-size: 11px; color: var(--accent-indigo); background: #1e1b4b; padding: 2px 8px; border-radius: 6px; font-weight: 600; display: inline-block; margin-bottom: 8px; }
        .card-desc { font-size: 12px; color: var(--text-sec); line-height: 1.5; margin-bottom: 16px; }
        .key-box { background: #0c1017; border: 1px dashed #334155; border-radius: 8px; padding: 10px; margin-bottom: 14px; }
        .key-label { font-size: 10px; color: var(--accent-amber); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .key-text { font-family: monospace; font-size: 12px; color: #38bdf8; word-break: break-all; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; border: none; display: inline-block; }
        .btn-primary { background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; }
        .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        .btn:hover { opacity: 0.9; }
        .auth-overlay { position: fixed; inset: 0; background: rgba(7, 10, 18, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-modal { background: var(--card); border: 1px solid var(--border); padding: 32px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .auth-input { width: 100%; padding: 12px 16px; background: #0a0f1d; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 14px; margin: 20px 0; outline: none; }
        .auth-input:focus { border-color: var(--accent-blue); }
    </style>
</head>

            <p style="font-size: 13px; color: var(--text-sec);">Military-Grade AES-256 Encrypted Vault. Enter Master Key to Decrypt:</p>
            <input type="password" id="passInput" class="auth-input" placeholder="Enter Master Password..." onkeydown="if(event.key==='Enter') unlockVault()">

            <p id="authError" style="color: #ef4444; font-size: 12px; margin-top: 12px; display: none;">Invalid Master Password. Decryption Failed.</p>
        </div>
    </div>

        let VAULT_DATA = null;

        async function decryptPayload(b64, password) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            const salt = bytes.slice(0, 16);
            const iv = bytes.slice(16, 28);
            const ciphertext = bytes.slice(28);

            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const key = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 65536,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                key,
                ciphertext
            );

            return JSON.parse(new TextDecoder().decode(decrypted));
        }

        async function unlockVault() {
            const pass = document.getElementById('passInput').value.trim();
            const err = document.getElementById('authError');
            err.style.display = 'none';

            if (!pass) {
                err.textContent = "Please enter Master Password.";
                err.style.display = 'block';
                return;
            }

            let cipherToUse = EMBEDDED_CIPHER;
            try {
                const res = await fetch("https://raw.githubusercontent.com/ankit261194/OtpForwarder/main/admin_vault.enc?t=" + Date.now());
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.length > 50) cipherToUse = text.trim();
                }
            } catch (e) {
                console.warn("Using offline embedded encrypted vault");
            }

            try {
                VAULT_DATA = await decryptPayload(cipherToUse, pass);
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                renderTools();
            } catch (e) {
                err.textContent = "Invalid Master Password or Decryption Failed.";
                err.style.display = 'block';
            }
        }

        function copyKey(key) {
            navigator.clipboard.writeText(key);
            alert('License Key Copied: ' + key);
        }

        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';
            VAULT_DATA.tools.forEach(t => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <div>
                                <span class="card-cat">${t.category}</span>
                                <h3 class="card-title">${t.name}</h3>
                                <div style="font-size: 11px; color: var(--text-sec);">v${t.version} • ${t.sizeDisplay}</div>
                            </div>
                        </div>
                        <p class="card-desc">${t.description}</p>
                        ${t.defaultLicenseKey ? `
                            <div class="key-box">
                                <div class="key-label">
                                    <span>Master License Key / Serial</span>
                                    <span style="cursor:pointer; color: var(--accent-blue);" onclick="copyKey('${t.defaultLicenseKey}')">📋 Copy</span>
                                </div>
                                <div class="key-text">${t.defaultLicenseKey}</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="btn-group">
                        <a href="${t.exeDownloadUrl}" target="_blank" class="btn btn-primary">⬇ Download Setup</a>
                        ${t.hasKeygen && t.keygenDownloadUrl ? `
                            <a href="${t.keygenDownloadUrl}" target="_blank" class="btn btn-secondary">🔑 Keygen / Zip</a>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
